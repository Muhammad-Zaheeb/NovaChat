# Keeps the free Render instance awake so visitors don't wait ~1 minute for a cold start.
# Pings /api/health, which does not touch the database, so Neon can still scale to zero.
# Notes: GitHub may delay scheduled runs at busy times, and it pauses schedules in repos
# with no commits for 60 days (re-enable from the Actions tab).
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      URL: ${{ vars.KEEPALIVE_URL || 'https://novachat-v022.onrender.com/api/health' }}
    steps:
      - name: Ping health endpoint
        run: |
          curl --silent --show-error --fail --max-time 90 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               -o /dev/null -w "status %{http_code} in %{time_total}s\n" "$URL"
